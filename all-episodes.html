<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YUME — Все серии</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Верхняя панель -->
    <div class="card-top-bar">
        <button class="back-btn" onclick="history.back()">←</button>
        <span class="episodes-title">Все серии</span>
        <div class="card-actions">
            <button class="fav-btn">♡</button>
            <button class="share-btn">↻</button>
        </div>
    </div>

    <!-- Информация об аниме -->
    <div class="episode-info-block">
        <img src="assets/posters/poster-placeholder.jpg" alt="Poster" class="episode-poster">
        <div class="episode-info-right">
            <h3>Твоё имя</h3>
            <p class="orig-title">Kimi no Na wa</p>
            <div class="episode-meta">
                <span>⭐ 8.8</span>
                <span>2016</span>
                <span>Фильм</span>
                <span>Завершено</span>
            </div>
        </div>
    </div>

    <!-- Описание -->
    <p class="episode-description">
        История о двух подростках, которые внезапно начинают меняться телами...
        <span class="read-more">...читать далее</span>
    </p>

    <!-- Вкладки -->
    <div class="tab-switcher">
        <button class="tab-btn active" id="episodes-tab">Серии</button>
        <button class="tab-btn" id="similar-tab">Похожие</button>
    </div>

    <!-- Список серий -->
    <div id="episodes-list">
        <div class="episode-item">
            <button class="play-ep-btn">▶</button>
            <div>
                <div class="episode-title">1. День, когда всё изменилось</div>
                <div class="episode-duration">24 мин</div>
            </div>
        </div>
        <div class="episode-item">
            <button class="play-ep-btn">▶</button>
            <div>
                <div class="episode-title">2. Неожиданная встреча</div>
                <div class="episode-duration">24 мин</div>
            </div>
        </div>
        <div class="episode-item">
            <button class="play-ep-btn">▶</button>
            <div>
                <div class="episode-title">3. Связь</div>
                <div class="episode-duration">24 мин</div>
            </div>
        </div>
    </div>

    <!-- Похожие (скрыто по умолчанию) -->
    <div id="similar-list" style="display: none;">
        <div class="similar-grid">
            <!-- Постеры похожих аниме -->
        </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="bottom-nav">
        <button class="nav-item" onclick="location.href='index.html'">
            <span class="nav-icon">🏠</span>Главная
        </button>
        <button class="nav-item" onclick="location.href='search.html'">
            <span class="nav-icon">🔍</span>Поиск
        </button>
        <button class="nav-item" onclick="location.href='catalog.html'">
            <span class="nav-icon">📚</span>Каталог
        </button>
        <button class="nav-item" onclick="location.href='profile.html'">
            <span class="nav-icon">👤</span>Профиль
        </button>
    </div>

    <script src="js/app.js"></script>
    <script src="js/episodes.js"></script>
</body>
</html>
