<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YUME — Поиск</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Уведомления -->
    <button class="notification-btn">🔔</button>

    <!-- Логотип -->
    <img src="assets/logos/logo-main.png" alt="YUME" class="logo-main">
    <p class="tagline">БОЛЬШЕ ЧЕМ АНИМЕ</p>

    <!-- Заголовок -->
    <h1 class="page-title">Поиск</h1>

    <!-- Поисковая строка + фильтры -->
    <div class="search-bar">
        <input type="text" class="search-input" placeholder="Найти аниме, жанр или код…">
        <button class="filter-btn">⚙️</button>
    </div>

    <!-- Популярные запросы -->
    <div class="section-header">
        <span class="section-title">🔥 Популярные запросы</span>
        <a href="#" class="section-all">Все ›</a>
    </div>
    <div class="popular-queries">
        <span class="query-tag">Наруто</span>
        <span class="query-tag">Атака титанов</span>
        <span class="query-tag">Ван Пис</span>
        <span class="query-tag">Магическая битва</span>
    </div>

    <!-- Результаты (появляются только после поиска) -->
    <div id="results-block" style="display: none;">
        <div class="section-header">
            <span class="section-title">Результаты</span>
            <span class="results-count">Найдено: 0</span>
        </div>
        <div class="results-list" id="results-list">
            <!-- Сюда будут подгружаться результаты -->
        </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="bottom-nav">
        <button class="nav-item" onclick="location.href='index.html'">
            <span class="nav-icon">🏠</span>Главная
        </button>
        <button class="nav-item active">
            <span class="nav-icon">🔍</span>Поиск
        </button>
        <button class="nav-item" onclick="location.href='catalog.html'">
            <span class="nav-icon">📚</span>Каталог
        </button>
        <button class="nav-item" onclick="location.href='profile.html'">
            <span class="nav-icon">👤</span>Профиль
        </button>
    </div>

    <script src="js/app.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
