<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YUME — Плеер</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Верхняя панель -->
    <div class="player-top">
        <button class="back-btn" onclick="history.back()">←</button>
        <div class="player-anime-title">Твоё имя</div>
    </div>
    <div class="player-episode-title">3 серия — Связь</div>

    <!-- Видеоплеер -->
    <div class="video-container">
        <div class="video-placeholder">
            <!-- Здесь будет видео -->
            <div class="video-controls">
                <button class="ctrl-btn">↩10</button>
                <button class="ctrl-btn play-btn">▶</button>
                <button class="ctrl-btn">10↪</button>
            </div>
            <div class="progress-bar">
                <span class="current-time">12:34</span>
                <div class="progress-track">
                    <div class="progress-fill" style="width:52%;"></div>
                </div>
                <span class="total-time">24:00</span>
            </div>
        </div>
    </div>

    <!-- Элементы управления -->
    <div class="player-controls">
        <button class="quality-btn">1080p ▼</button>
        <button class="subs-btn">字幕</button>
        <button class="fullscreen-btn">⛶</button>
    </div>

    <!-- Информация о серии -->
    <p class="player-episode-info">3 серия — Связь</p>

    <!-- Навигация по сериям -->
    <div class="episode-nav">
        <button class="nav-prev">← Пред. серия</button>
        <div class="nav-divider">|</div>
        <button class="nav-next">След. серия →</button>
    </div>

    <!-- Логотип YUME (белый, только в плеере) -->
    <img src="assets/logos/logo-player.png" alt="YUME" class="player-logo">

    <!-- Нижняя навигация (скрыта, так как логотип внизу) -->
    <!-- 
    <div class="bottom-nav">... 
    -->

    <script src="js/app.js"></script>
    <script src="js/player.js"></script>
</body>
</html>
